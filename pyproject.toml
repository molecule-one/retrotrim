[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uspto-reaction-scorers"
version = "0.1.0"
description = "USPTO-trained Reaction Prior and Reaction Graph Plausibility scorers"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.12"
dependencies = ["numpy==1.26.4", "pandas>=2,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
reference = ["rdkit==2022.9.5", "igraph==0.11.8"]
models = ["torch==2.7.0", "transformers==4.51.3", "rdkit==2022.9.5"]
train = ["torch==2.7.0", "transformers==4.51.3", "rdkit==2022.9.5", "pytorch-lightning==2.5.1"]
test = ["pytest>=8,<9"]
retro = [
    "syntheseus[root-aligned]==0.9.0",
    "rxnmapper==0.4.2",
    "torch==2.7.0",
    "transformers==4.51.3",
    "rdkit==2022.9.5",
    "igraph==0.11.8",
]

[project.scripts]
uspto-evaluate = "reaction_scorers.evaluate:main"
uspto-score = "reaction_scorers.score:main"

[tool.setuptools.packages.find]
include = ["reaction_scorers*"]

[tool.setuptools.package-data]
reaction_scorers = ["vocabulary.json", "reference_valences.json"]

[tool.ruff]
line-length = 88
